services:
  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    command: >
      redis-server
      --requirepass redispass
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: urlshortener-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: urlshortener
      MYSQL_USER: shortener
      MYSQL_PASSWORD: shortenerpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis GUI: http://localhost:5540  (host: redis, port: 6379, password: redispass)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: urlshortener-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Spring Boot app (optional). Run with: docker compose --profile app up --build
  app:
    build: .
    container_name: urlshortener-app
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/urlshortener
      SPRING_DATASOURCE_USERNAME: shortener
      SPRING_DATASOURCE_PASSWORD: shortenerpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  redis-data:
  mysql-data:
  redisinsight-data: